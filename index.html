<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Shezadii ❤️</title>
    <!-- Google Fonts for beautiful typography -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Dancing Script', cursive, sans-serif;
            background: linear-gradient(145deg, #2b1a2e, #1f1222);
            color: #ffe9f4;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Question Overlay */
        .question-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s;
        }

        .question-box {
            background: rgba(43, 26, 46, 0.95);
            border: 3px solid #ff99bb;
            border-radius: 60px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 0 100px #ff4d88;
            max-width: 600px;
            width: 90%;
        }

        .question-box h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 4rem;
            color: #ffe9f4;
            text-shadow: 0 0 30px #ff80a5;
            margin-bottom: 40px;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            position: relative;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 40px;
            font-size: 2rem;
            font-family: 'Dancing Script', cursive;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(255, 77, 136, 0.8);
            font-weight: bold;
            min-width: 150px;
        }

        .btn-yes {
            background: #ff4d88;
            color: white;
            border: 2px solid #ffe4f0;
        }

        .btn-yes:hover {
            background: #ff80a5;
            transform: scale(1.1);
            box-shadow: 0 0 40px #ffb3c6;
        }

        .btn-no {
            background: #3a2a3f;
            color: #ffe9f4;
            border: 2px solid #ff99bb;
            position: relative;
            transition: all 0.2s;
        }

        .btn-no:hover {
            /* No hover effect – it will move */
        }

        /* Main content (hidden initially) */
        .main-content {
            display: none;
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
        }

        /* Floating garden (same as before) */
        .floating-garden {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .flower, .petal {
            position: absolute;
            font-size: 2rem;
            user-select: none;
            animation: floatFlower 20s infinite linear;
            filter: drop-shadow(0 0 10px #ffa5c3);
            opacity: 0.6;
        }

        .petal {
            font-size: 1.2rem;
            animation: floatPetal 15s infinite ease-in-out;
        }

        @keyframes floatFlower {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
        }

        @keyframes floatPetal {
            0% { transform: translateY(110vh) translateX(0) rotate(0deg); opacity: 0; }
            20% { opacity: 0.9; }
            100% { transform: translateY(-20vh) translateX(50px) rotate(180deg); opacity: 0; }
        }

        .glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(255, 192, 203, 0.2), transparent 70%);
            z-index: 0;
        }

        #binary-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.05;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 100%;
        }

        /* ========== EXTRAORDINARY HEART GIFT BOX ========== */
        .gift-wrapper {
            position: relative;
            display: inline-block;
            cursor: pointer;
            text-align: center;
            z-index: 20;
            animation: floatHeart 3s ease-in-out infinite;
            filter: drop-shadow(0 0 40px #ff80a5);
        }

        .heart-box {
            position: relative;
            width: 340px;
            height: 310px;
            background: linear-gradient(145deg, #ff99bb, #ff4d88);
            transform: rotate(-45deg);
            border-radius: 50% 50% 0 50%;
            box-shadow: 0 20px 40px rgba(255, 77, 136, 0.8), 0 0 80px #ffb3c6, 0 0 120px rgba(255, 105, 180, 0.5);
            margin-bottom: 20px;
            transition: all 0.3s;
            border: 3px solid #ffe4ec;
            animation: sparkle 2s infinite alternate;
        }

        @keyframes sparkle {
            0% { box-shadow: 0 20px 40px rgba(255, 77, 136, 0.8), 0 0 80px #ffb3c6, 0 0 120px rgba(255, 105, 180, 0.5); }
            100% { box-shadow: 0 20px 60px rgba(255, 77, 136, 1), 0 0 120px #ffd9e6, 0 0 180px rgba(255, 182, 193, 0.8); }
        }

        .heart-box::before,
        .heart-box::after {
            content: '';
            position: absolute;
            width: 340px;
            height: 310px;
            background: inherit;
            border-radius: 50% 50% 0 50%;
            box-shadow: inherit;
        }

        .heart-box::before {
            top: -155px;
            left: 0;
            border-radius: 50% 50% 50% 0;
        }

        .heart-box::after {
            left: 155px;
            top: 0;
            border-radius: 50% 0 50% 50%;
        }

        .heart-ribbon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            width: 140px;
            height: 40px;
            background: #ffe4f0;
            border-radius: 30px;
            box-shadow: 0 0 40px #fff;
            z-index: 25;
            border: 2px solid #ff99bb;
        }

        .heart-ribbon::before,
        .heart-ribbon::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 140px;
            background: #ffe4f0;
            border-radius: 30px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 40px #fff;
            border: 2px solid #ff99bb;
        }

        .heart-ribbon::before { transform: translate(-50%, -50%) rotate(90deg); }
        .heart-ribbon::after { transform: translate(-50%, -50%) rotate(0deg); }

        /* Sparkling dots around the heart */
        .sparkle {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 0 20px gold;
            z-index: 30;
            animation: twinkle 1.5s infinite alternate;
        }

        .sparkle1 { top: 20%; left: 10%; animation-delay: 0s; }
        .sparkle2 { top: 60%; right: 15%; animation-delay: 0.5s; }
        .sparkle3 { bottom: 20%; left: 30%; animation-delay: 1s; }
        .sparkle4 { bottom: 40%; right: 25%; animation-delay: 1.5s; }

        @keyframes twinkle {
            0% { transform: scale(1); opacity: 0.7; }
            100% { transform: scale(1.5); opacity: 1; }
        }

        .garden-flower {
            position: absolute;
            font-size: 3rem;
            filter: drop-shadow(0 0 20px #ffb6d9);
            animation: sway 5s ease-in-out infinite;
            z-index: 15;
        }

        .garden1 { top: -60px; left: -60px; animation-delay: 0s; }
        .garden2 { top: -50px; right: -50px; animation-delay: 0.7s; }
        .garden3 { bottom: -50px; left: -40px; animation-delay: 1.2s; }
        .garden4 { bottom: -40px; right: -60px; animation-delay: 1.9s; }
        .garden5 { top: 40px; left: -80px; animation-delay: 2.3s; }
        .garden6 { top: 30px; right: -80px; animation-delay: 2.8s; }

        @keyframes sway {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(20deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes floatHeart {
            0% { transform: translateY(0); }
            50% { transform: translateY(-30px); }
            100% { transform: translateY(0); }
        }

        .gift-wrapper.open {
            animation: openHeart 0.9s forwards;
        }

        @keyframes openHeart {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; }
        }

        .gift-message {
            color: #ffe9f4;
            font-size: 2rem;
            margin-top: 40px;
            text-shadow: 0 0 20px #ff80a5, 0 0 40px #ff4d88;
            position: relative;
            z-index: 30;
            background: rgba(43, 26, 46, 0.6);
            padding: 12px 30px;
            border-radius: 60px;
            backdrop-filter: blur(5px);
            display: inline-block;
            border: 2px solid #ff99bb;
            font-family: 'Great Vibes', cursive;
            letter-spacing: 2px;
        }

        /* ========== ICONS CONTAINER ========== */
        .icons-container {
            display: none;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            max-width: 1200px;
            margin: 40px auto 0;
            padding: 25px;
            background: rgba(43, 26, 46, 0.3);
            backdrop-filter: blur(8px);
            border-radius: 60px;
            border: 2px solid #ff99bb;
            box-shadow: 0 0 50px #ff80a5;
        }

        .icon-item {
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #ff99bb;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.4s;
            box-shadow: 0 0 25px #ff80a5;
            backdrop-filter: blur(4px);
        }

        .icon-item:hover {
            background: #ff4d88;
            transform: scale(1.15) rotate(3deg);
            box-shadow: 0 0 50px #ffb3c6;
            border-color: #ffe4f0;
        }

        .icon-item span {
            font-size: 3.2rem;
            filter: drop-shadow(0 0 10px #fff);
        }

        .icon-item p {
            font-size: 1.1rem;
            margin-top: 8px;
            font-weight: bold;
            color: #ffe9f4;
            text-shadow: 0 0 10px #ff4d88;
            font-family: 'Dancing Script', cursive;
        }

        /* ========== MODAL STYLES ========== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-card {
            background: rgba(43, 26, 46, 0.9);
            border: 3px solid #ff99bb;
            border-radius: 50px;
            padding: 35px;
            max-width: 650px;
            max-height: 80vh;
            overflow-y: auto;
            color: #ffe9f4;
            box-shadow: 0 0 100px #ff4d88;
            position: relative;
            width: 90%;
            backdrop-filter: blur(10px);
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 25px;
            font-size: 3rem;
            cursor: pointer;
            color: #ff99bb;
            transition: 0.2s;
        }

        .close-modal:hover {
            color: #fff;
            transform: scale(1.2);
        }

        h2 {
            color: #ffe9f4;
            margin-bottom: 20px;
            border-bottom: 3px solid #ff99bb;
            padding-bottom: 10px;
            font-family: 'Great Vibes', cursive;
            font-size: 2.8rem;
            text-shadow: 0 0 20px #ff80a5;
            letter-spacing: 2px;
        }

        .reason-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .reason-item {
            background: rgba(255, 77, 136, 0.2);
            padding: 8px;
            border-radius: 8px;
            font-size: 1rem;
            border: 1px solid #ff99bb;
            font-family: 'Dancing Script', cursive;
        }

        .playlist-item {
            padding: 8px;
            border-bottom: 1px solid #ff99bb;
            font-size: 1.2rem;
        }

        .floating-signature {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(43,26,46,0.6);
            padding: 8px 20px;
            border-radius: 40px;
            border: 2px solid #ff99bb;
            color: #ffe9f4;
            z-index: 200;
            backdrop-filter: blur(5px);
            font-size: 1.4rem;
            font-family: 'Great Vibes', cursive;
        }

        .music-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #ff4d88;
            border: 3px solid #ffe4f0;
            color: white;
            font-size: 2.2rem;
            cursor: pointer;
            z-index: 200;
            box-shadow: 0 0 30px #ff80a5;
            transition: 0.3s;
        }

        .music-btn:hover {
            transform: scale(1.1);
            background: #ff80a5;
        }

        /* Quiz styles */
        .quiz-question {
            margin: 20px 0;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            border: 1px solid #ff99bb;
        }
        .quiz-question p { font-size: 1.3rem; margin-bottom: 10px; font-family: 'Dancing Script', cursive; }
        .quiz-option {
            display: block;
            margin: 5px 0;
            padding: 8px 12px;
            background: #3a2a3f;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1.1rem;
        }
        .quiz-option:hover { background: #ff4d88; }
        .quiz-option input { margin-right: 10px; accent-color: #ff4d88; }
        .quiz-submit {
            background: #ff4d88;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 1.3rem;
            cursor: pointer;
            margin: 15px 0;
            border: 1px solid #ffe4f0;
            font-family: 'Dancing Script', cursive;
        }
        .quiz-result { font-size: 1.8rem; color: #ffe9f4; text-align: center; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .pulse-heart { animation: pulse 2s infinite; }
    </style>
</head>
<body>
    <div class="glow"></div>
    <canvas id="binary-bg"></canvas>

    <!-- Pre-gift Question Overlay -->
    <div class="question-overlay" id="questionOverlay">
        <div class="question-box">
            <h1>Do You Love me shezadii?</h1>
            <div class="button-container">
                <button class="btn btn-yes" id="yesBtn">Yes 🥹</button>
                <button class="btn btn-no" id="noBtn">No 🙂‍↔️</button>
            </div>
        </div>
    </div>

    <!-- Main Content (hidden until Yes is clicked) -->
    <div class="main-content" id="mainContent">
        <div class="floating-garden" id="floatingGarden"></div>
        <div class="floating-signature">💖 Mubashir & Fatima 💖</div>
        <button class="music-btn" id="musicBtn" onclick="toggleMusic()">🎵</button>

        <div class="container">
            <!-- Extraordinary gift box with sparkles -->
            <div class="gift-wrapper" id="giftWrapper" onclick="openGift()">
                <div class="heart-box" id="heartBox">
                    <div class="heart-ribbon"></div>
                    <div class="sparkle sparkle1"></div>
                    <div class="sparkle sparkle2"></div>
                    <div class="sparkle sparkle3"></div>
                    <div class="sparkle sparkle4"></div>
                </div>
                <div class="garden-flower garden1">🌸</div>
                <div class="garden-flower garden2">🌼</div>
                <div class="garden-flower garden3">🌺</div>
                <div class="garden-flower garden4">🌹</div>
                <div class="garden-flower garden5">🌷</div>
                <div class="garden-flower garden6">🌸</div>
                <div class="gift-message">✨ open your heart ✨</div>
            </div>

            <!-- Icons container -->
            <div class="icons-container" id="iconsContainer">
                <div class="icon-item" onclick="openModal('valentine')"><span>❤️</span><p>Valentine</p></div>
                <div class="icon-item" onclick="openModal('letter')"><span>💌</span><p>Letter</p></div>
                <div class="icon-item" onclick="openModal('reasons')"><span>💖</span><p>Reasons</p></div>
                <div class="icon-item" onclick="openModal('promise')"><span>🤝</span><p>Promise</p></div>
                <div class="icon-item" onclick="openModal('poem')"><span>📝</span><p>Poem</p></div>
                <div class="icon-item" onclick="openModal('playlist')"><span>🎵</span><p>Playlist</p></div>
                <div class="icon-item" onclick="openModal('candle')"><span>🕯️</span><p>Wish</p></div>
                <div class="icon-item" onclick="openModal('surprise')"><span>🎁</span><p>Hidden</p></div>
                <div class="icon-item" onclick="openModal('openwhen')"><span>💌</span><p>Open When</p></div>
                <div class="icon-item" onclick="openModal('quiz')"><span>❓</span><p>Quiz</p></div>
                <div class="icon-item" onclick="openModal('constellation')"><span>✨</span><p>Stars</p></div>
                <div class="icon-item" onclick="openModal('friend')"><span>👥</span><p>Friends</p></div>
                <div class="icon-item" onclick="openModal('heart')"><span>❤️</span><p>Heart</p></div>
                <div class="icon-item" onclick="openModal('signature')"><span>✍️</span><p>Note</p></div>
            </div>
        </div>

        <!-- All modals (unchanged) -->
        <!-- Valentine Modal -->
        <div class="modal" id="modal-valentine">
            <div class="modal-card" style="text-align:center;">
                <span class="close-modal" onclick="closeModal('valentine')">&times;</span>
                <h2>💘 Happy Valentines day shezadii Meri Jan 💘</h2>
